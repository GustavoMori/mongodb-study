services:
  mongo:
    image: mongo:8.0
    container_name: mongo-study
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongo-data:/data/db
      - ./data:/data/import:ro
      - ./exercises:/exercises:ro

volumes:
  mongo-data:
